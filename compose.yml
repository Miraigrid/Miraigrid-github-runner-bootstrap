services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
    restart: unless-stopped
    init: true
    working_dir: ${RUNNER_DIR}
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ${RUNNER_DIR}:${RUNNER_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["./run.sh"]
