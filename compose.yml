services:
  runner:
    image: ghcr.io/actions/actions-runner:latest
    restart: unless-stopped
    init: true
    working_dir: /opt/miraigrid-runner
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /opt/miraigrid-runner:/opt/miraigrid-runner
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["./run.sh"]
